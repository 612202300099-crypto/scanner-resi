name: Desty Sync Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/desty-sync.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Vercel Desty sync endpoint
        shell: bash
        run: |
          set -euo pipefail
          echo "Triggering https://scanner-resi.vercel.app/api/sync-desty"

          response_file="$(mktemp)"
          http_code=$(curl -sS \
            --max-time 55 \
            -X POST \
            -H 'Content-Type: application/json' \
            -o "$response_file" \
            -w '%{http_code}' \
            'https://scanner-resi.vercel.app/api/sync-desty')

          echo "HTTP ${http_code}"
          cat "$response_file"
          echo

          if [ "$http_code" != "200" ]; then
            echo "Sync endpoint returned HTTP ${http_code}" >&2
            exit 1
          fi

          if ! grep -q '"success":true' "$response_file"; then
            echo "Sync endpoint did not report success=true" >&2
            exit 1
          fi

          echo "Desty sync completed successfully."
